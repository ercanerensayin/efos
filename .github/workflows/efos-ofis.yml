name: EFOS-Ofis Derle (EXE + APK)

on:
  workflow_dispatch:
  push:
    branches: [efos-ofis]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bağımlılıklar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Testler
        # Windows'ta "offscreen" Qt eklentisi sistem yazı tiplerini yüklemez (PDF metni boş çıkar);
        # runner'ın masaüstü oturumu olduğu için varsayılan "windows" eklentisi kullanılır.
        run: python -m unittest discover -s tests -v
      - name: Tek dosya EXE
        run: python -m PyInstaller --noconfirm --clean EFOS-Ofis.spec
      - name: EXE MCP kipini dene (EFOS-Ofis.exe --mcp)
        shell: python
        run: |
          import json, subprocess, sys
          reqs = "\n".join(json.dumps(r) for r in [
              {"jsonrpc": "2.0", "id": 1, "method": "initialize"},
              {"jsonrpc": "2.0", "id": 2, "method": "tools/list"},
          ]) + "\n"
          p = subprocess.run([r"dist\EFOS-Ofis.exe", "--mcp"], input=reqs.encode(), capture_output=True, timeout=180)
          out = p.stdout.decode("utf-8", "replace").splitlines()
          print("stdout satır:", len(out), "| stderr:", p.stderr.decode("utf-8", "replace")[:500])
          assert len(out) == 2, out
          assert json.loads(out[0])["result"]["serverInfo"]["name"] == "efos-ofis"
          assert len(json.loads(out[1])["result"]["tools"]) >= 23
          print("MCP kipi çalışıyor")
      - name: Klasör sürümü (hızlı açılış + efos-mcp.exe)
        env:
          EFOS_ONEDIR: "1"
        run: |
          python -m PyInstaller --noconfirm EFOS-Ofis.spec --distpath dist_klasor --workpath build_klasor
          Compress-Archive -Path dist_klasor\EFOS-Ofis -DestinationPath dist\EFOS-Ofis-Windows-Klasor.zip
      - name: Boyut raporu
        run: Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: EFOS-Ofis-Windows
          path: |
            dist/EFOS-Ofis.exe
            dist/EFOS-Ofis-Windows-Klasor.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Yayın anahtarı (varsa GitHub sırlarından)
        env:
          KS_B64: ${{ secrets.EFOS_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/efos-yayin.jks"
            echo "EFOS_KEYSTORE=$RUNNER_TEMP/efos-yayin.jks" >> "$GITHUB_ENV"
          fi
      - name: APK derle (testler dahil)
        env:
          EFOS_KEY_ALIAS: ${{ secrets.EFOS_RELEASE_KEY_ALIAS }}
          EFOS_KEYSTORE_PASS: ${{ secrets.EFOS_RELEASE_KEYSTORE_PASS }}
          EFOS_KEY_PASS: ${{ secrets.EFOS_RELEASE_KEY_PASS }}
        run: bash android_native/apk_derle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EFOS-Ofis-Android
          path: dist/EFOS-Ofis.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Releases'a koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete efos-ofis-son-surum -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          gh release create efos-ofis-son-surum -R "$GITHUB_REPOSITORY" \
            art/EFOS-Ofis-Windows/EFOS-Ofis.exe \
            art/EFOS-Ofis-Windows/EFOS-Ofis-Windows-Klasor.zip \
            art/EFOS-Ofis-Android/EFOS-Ofis.apk \
            --title "EFOS-Ofis (son sürüm)" \
            --notes "Otomatik derlendi: ${{ github.sha }} (efos-ofis dalı)" \
            --target "${{ github.sha }}"
