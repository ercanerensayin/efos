name: APK Derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: OtoMakro-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: APK'yı Releases'a koy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OtoMakro.apk
          gh release delete son-surum -y --cleanup-tag || true
          gh release create son-surum OtoMakro.apk --title "OtoMakro (son sürüm)" --notes "Otomatik derlendi: ${{ github.sha }}" --target ${{ github.sha }}
